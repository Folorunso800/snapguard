[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
ffi = false
via_ir = false

# Remap Reactive Omni library (official Reactive-Network/reactive-lib-omni)
remappings = [
  "@reactive/=lib/reactive-lib-omni/src/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "${LASNA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"

[etherscan]
# explorers optional later
